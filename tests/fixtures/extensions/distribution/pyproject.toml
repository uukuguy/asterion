[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acme-capability-sample"
version = "1.0.0"
requires-python = ">=3.10"

[project.entry-points."asterion.capability_packages"]
"acme.sample@1.0.0" = "acme_capability_sample.provider:create_package"

[tool.hatch.build.targets.wheel]
packages = ["src/acme_capability_sample"]

[tool.hatch.build.targets.wheel.force-include]
"payload" = "asterion_capability_packages/acme.sample@1.0.0"
