[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asterion-acme-sample-extension"
version = "1.0.0"
description = "Asterion installed capability package fixture"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."asterion.capability_packages"]
"acme.sample@1.0.0" = "acme_sample_extension.provider:create_package"

[tool.hatch.build.targets.wheel]
packages = ["src/acme_sample_extension"]

[tool.hatch.build.targets.wheel.force-include]
"payload" = "asterion_capability_packages/acme.sample/1.0.0/payload"
