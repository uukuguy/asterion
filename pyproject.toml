[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asterion"
version = "0.1.0"
description = "Composable multi-runtime agent application framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8.0", "pyarrow>=18.0.0", "python-dotenv>=1.0.0"]

[project.optional-dependencies]
setup = ["huggingface-hub>=0.30.0"]

[dependency-groups]
dev = ["ruff>=0.12.0"]

[project.scripts]
asterion = "asterion.cli:main"
asterion-dci = "asterion.applications.dci_agent_lite.cli:main"

[project.entry-points."asterion.applications"]
controlled-code = "asterion.applications.controlled_code:create_provider"
dci-agent-lite = "asterion.applications.dci_agent_lite:create_provider"

[project.entry-points."asterion.application_index"]
"code.quality__1.0.0" = "asterion.applications.controlled_code:create_provider"
"dci.complete-application__1.0.0" = "asterion.applications.dci_agent_lite:create_provider"
"dci.local-benchmark-application__1.0.0" = "asterion.applications.dci_agent_lite:create_provider"
"dci.research-capability__1.0.0" = "asterion.applications.dci_agent_lite:create_provider"

[project.entry-points."asterion.host_services"]
"corpus.local-root" = "asterion.capabilities.dci.implementation.services:create_local_corpus_service_factory"
"evaluation.answer-judge" = "asterion.capabilities.dci.implementation.services:create_answer_judge_service_factory"

[tool.hatch.build.targets.wheel]
packages = ["src/asterion"]
artifacts = [
    "src/asterion/capabilities/dci/resources/pi/*.ts",
    "src/asterion/capabilities/dci/resources/pi/*.mjs",
    "src/asterion/control/providers/prime/resources/control-plane.json",
    "src/asterion/control/providers/prime/resources/skills/asterion-control/pyproject.toml",
    "src/asterion/control/providers/prime/resources/skills/asterion-control/src/asterion_control/*.py",
]

[tool.hatch.build.targets.wheel.force-include]
"packages/typescript/prime-gateway/resources/prime-artifact-lock.json" = "asterion/control/providers/prime/resources/prime-artifact-lock.json"
"packages/typescript/prime-gateway/resources/prime-ecosystem-module-lock.json" = "asterion/control/providers/prime/resources/prime-ecosystem-module-lock.json"
"packages/typescript/prime-gateway/resources/prime-ecosystem-module.mjs" = "asterion/control/providers/prime/resources/prime-ecosystem-module.mjs"
"packages/typescript/prime-gateway/resources/prime-client-module-lock.json" = "asterion/control/providers/prime/resources/prime-client-module-lock.json"
"packages/typescript/prime-gateway/resources/prime-client-module.mjs" = "asterion/control/providers/prime/resources/prime-client-module.mjs"
"schemas/benchmark-suite/v1/benchmark-suite.schema.json" = "asterion/schemas/benchmark-suite/v1/benchmark-suite.schema.json"
"schemas/agent-system/v1/agent-system.schema.json" = "asterion/schemas/agent-system/v1/agent-system.schema.json"
"schemas/control-plane/v1/control-plane-manifest.schema.json" = "asterion/schemas/control-plane/v1/control-plane-manifest.schema.json"
"schemas/agent-control/v1/command.schema.json" = "asterion/schemas/agent-control/v1/command.schema.json"
"schemas/agent-control/v1/event.schema.json" = "asterion/schemas/agent-control/v1/event.schema.json"
"schemas/agent-client/v1/intent.schema.json" = "asterion/schemas/agent-client/v1/intent.schema.json"
"schemas/agent-client/v1/event.schema.json" = "asterion/schemas/agent-client/v1/event.schema.json"
"schemas/session-context/v1/command.schema.json" = "asterion/schemas/session-context/v1/command.schema.json"
"schemas/session-context/v1/receipt.schema.json" = "asterion/schemas/session-context/v1/receipt.schema.json"
"schemas/operation/v1/auth-request.schema.json" = "asterion/schemas/operation/v1/auth-request.schema.json"
"schemas/operation/v1/model-selection-request.schema.json" = "asterion/schemas/operation/v1/model-selection-request.schema.json"
"schemas/operation/v1/operation-request-descriptor.schema.json" = "asterion/schemas/operation/v1/operation-request-descriptor.schema.json"
"schemas/operation/v1/operation-transaction.schema.json" = "asterion/schemas/operation/v1/operation-transaction.schema.json"
"schemas/operation/v1/operation-receipt.schema.json" = "asterion/schemas/operation/v1/operation-receipt.schema.json"
