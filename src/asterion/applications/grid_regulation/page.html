<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>规程检索</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #efeae2;
      --sheet: #fbf8f3;
      --ink: #1b2330;
      --muted: #45515d;
      --line: #d4cdc2;
      --seal: #8e2f2a;
      --navy: #1a3648;
      --navy-ink: #f7f4ee;
      --mark: #f0d48a;
      --mark-ink: #1a1408;
      --focus: #1a3648;
      --shadow: 0 18px 40px rgba(27, 35, 48, 0.06);
      --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
      --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "PMingLiU", serif;
      --mono: "SF Mono", "Sarasa Mono SC", ui-monospace, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --paper: #12161c;
        --sheet: #1b212a;
        --ink: #f0eadf;
        --muted: #c9d2da;
        --line: #343c46;
        --seal: #efc2bc;
        --navy: #d7e6ee;
        --navy-ink: #122028;
        --mark: #e6c56a;
        --mark-ink: #1a1408;
        --focus: #d7e6ee;
        --shadow: none;
      }
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); }

    body {
      margin: 0;
      overflow-x: clip;
      min-height: 100dvh;
      color: var(--ink);
      background:
        linear-gradient(var(--seal), var(--seal)) top / 100% 3px no-repeat,
        var(--paper);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;
    }

    .skip {
      position: absolute;
      left: 16px;
      top: 12px;
      transform: translateY(-140%);
      background: var(--navy);
      color: var(--navy-ink);
      padding: 8px 12px;
      z-index: 2;
    }

    .skip:focus { transform: none; }

    .frame {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .masthead {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: end;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--ink);
      box-shadow: 0 3px 0 var(--seal);
    }

    .brand { display: flex; gap: 16px; align-items: center; }

    .seal {
      width: 48px;
      height: 48px;
      color: var(--seal);
      flex: none;
    }

    .kicker, .quiet, .label, .meta, .path, .note {
      margin: 0;
      color: var(--muted);
    }

    .kicker {
      font-size: 13px;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 32px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.04em;
    }

    .quiet { font-size: 14px; text-align: right; }

    .layout {
      display: grid;
      gap: 24px;
      margin-top: 32px;
    }

    @media (min-width: 960px) {
      .frame { width: min(1120px, calc(100% - 64px)); padding-top: 40px; }
      .layout { grid-template-columns: 340px minmax(0, 1fr); gap: 40px; align-items: start; }
      .desk { position: sticky; top: 24px; }
    }

    .desk, .sheet {
      background: var(--sheet);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .desk { padding: 20px; }

    form { display: grid; gap: 16px; }

    .field { display: grid; gap: 8px; }

    label, legend {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    input[type="text"] {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
    }

    input[type="text"]:focus-visible,
    button:focus-visible,
    .check:focus-within {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    input::placeholder { color: var(--muted); opacity: 1; }

    .sheet:focus { outline: none; }

    .sheet:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .hint { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }

    fieldset {
      margin: 0;
      padding: 0;
      border: 0;
      display: grid;
      gap: 8px;
    }

    .checks { display: flex; gap: 8px; }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 4px;
      cursor: pointer;
      background: var(--paper);
    }

    .check input { width: 18px; height: 18px; margin: 0; accent-color: var(--navy); }

    button {
      min-height: 48px;
      border: 0;
      border-radius: 4px;
      background: var(--navy);
      color: var(--navy-ink);
      font: inherit;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background-color 180ms ease, opacity 180ms ease;
    }

    button:hover { filter: brightness(1.08); }

    button:active { filter: brightness(0.94); }

    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .files { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }

    .files h2, .sheet h2 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .path { font-family: var(--mono); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }

    .file-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }

    .file-list li {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 4px 12px;
      align-items: baseline;
      min-width: 0;
      font-size: 14px;
    }

    .file-list strong { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }

    .meta { font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }

    .sheet {
      min-height: 420px;
      padding: 28px 28px 32px;
      border-top: 4px solid var(--ink);
    }

    .sheet h2 { color: var(--muted); }

    .lede {
      max-width: 38em;
      margin: 24px 0 0;
      font-family: var(--serif);
      font-size: 20px;
      line-height: 1.75;
    }

    .clause-title {
      margin: 8px 0 0;
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 600;
      line-height: 1.3;
    }

    .status {
      margin: 16px 0 0;
      color: var(--ink);
      font-weight: 600;
    }

    .status.is-alert { color: var(--seal); }

    .status:empty { display: none; }

    .group { margin-top: 28px; }

    .group header { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }

    .group h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    article {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .where {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    blockquote {
      margin: 0;
      max-width: 40em;
      font-family: var(--serif);
      font-size: 18px;
      line-height: 1.85;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    mark {
      background: var(--mark);
      color: var(--mark-ink);
      padding: 0 0.12em;
    }

    .note { margin-top: 20px; font-size: 13px; }

    footer {
      width: min(1120px, calc(100% - 32px));
      margin: 8px auto 0;
      color: var(--muted);
      font-size: 13px;
    }

    @media (min-width: 960px) {
      footer { width: min(1120px, calc(100% - 64px)); }
    }

    @media (max-width: 719px) {
      .masthead { display: block; }
      .quiet { margin-top: 12px; text-align: left; }
      .sheet, .desk { padding: 16px; }
      .lede, blockquote { font-size: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#result">跳到引用结果</a>
  <div class="frame">
    <header class="masthead">
      <div class="brand">
        <svg class="seal" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="3.5" y="3.5" width="41" height="41" fill="none" stroke="currentColor" stroke-width="1.5"></rect>
          <rect x="7.5" y="7.5" width="33" height="33" fill="none" stroke="currentColor" stroke-width="0.75"></rect>
          <text x="24" y="31" text-anchor="middle" font-size="18" font-family="Songti SC, serif">条</text>
        </svg>
        <div>
          <p class="kicker">调度运行文件</p>
          <h1>规程检索</h1>
        </div>
      </div>
      <p class="quiet">按条款号核对原文位置</p>
    </header>
    <main class="layout">
      <div class="desk">
        <form id="query">
          <div class="field">
            <label for="clause">条款号</label>
            <input id="clause" name="clause_id" type="text" required autocomplete="off" spellcheck="false" placeholder="4.1.2">
          </div>
          <div class="field">
            <label for="version">版本</label>
            <input id="version" name="version" type="text" required autocomplete="off" placeholder="文件中出现的版本字样">
          </div>
          <div class="field">
            <label for="finding">语句</label>
            <input id="finding" name="finding" type="text" required autocomplete="off" aria-describedby="finding-hint">
            <p class="hint" id="finding-hint">这句话可以分在相邻段落。检索只核对该条款里是否出现它。</p>
          </div>
          <fieldset>
            <legend>文件</legend>
            <div class="checks">
              <label class="check"><input id="tool-docx" type="checkbox" checked> DOCX</label>
              <label class="check"><input id="tool-pdf" type="checkbox" checked> PDF</label>
            </div>
          </fieldset>
          <button id="search" type="submit">检索</button>
          <p class="status" id="form-status" role="status"></p>
        </form>
        <section class="files" aria-labelledby="files-title">
          <h2 id="files-title">目录</h2>
          <p class="path" id="root">正在读取目录</p>
          <ul class="file-list" id="files"></ul>
        </section>
      </div>
      <section class="sheet" id="result" tabindex="-1" aria-live="polite">
        <h2>引用</h2>
        <p class="lede" id="lede">结果会按文件中的顺序，列出版本所在处、条款标题，以及语句落在的段落或文本行。</p>
      </section>
    </main>
  </div>
  <footer>引用只说明这句话出现在该条款中。</footer>
  <script>
    const form = document.querySelector("#query");
    const result = document.querySelector("#result");
    const formStatus = document.querySelector("#form-status");
    const rootNode = document.querySelector("#root");
    const fileList = document.querySelector("#files");
    const button = document.querySelector("#search");

    const kinds = {
      "docx-paragraph": "段落",
      "docx-cell": "表格",
      "pdf-text": "页面",
    };

    function tools() {
      const selected = [];
      if (document.querySelector("#tool-docx").checked) selected.push("docx");
      if (document.querySelector("#tool-pdf").checked) selected.push("pdf");
      return selected.join(",");
    }

    function sizeLabel(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + " KB";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    function where(anchor) {
      const position = anchor.position;
      if (anchor.kind === "docx-paragraph") {
        const bits = ["序号 " + position.paragraph];
        if (Object.prototype.hasOwnProperty.call(position, "numbering_id")) {
          bits.push("编号 " + position.numbering_id);
        }
        return bits.join(" · ");
      }
      if (anchor.kind === "docx-cell") {
        return "表 " + position.table + " · 行 " + position.row + " · 格 " + position.cell;
      }
      return "第 " + position.page + " 页 · 行 " + position.item;
    }

    function excerpt(text, finding) {
      const block = document.createElement("blockquote");
      if (!finding || !text.includes(finding)) {
        block.textContent = text;
        return block;
      }
      const parts = text.split(finding);
      parts.forEach((part, index) => {
        block.append(document.createTextNode(part));
        if (index < parts.length - 1) {
          const mark = document.createElement("mark");
          mark.textContent = finding;
          block.append(mark);
        }
      });
      return block;
    }

    function clearResult(message) {
      result.replaceChildren();
      const title = document.createElement("h2");
      title.textContent = "引用";
      const copy = document.createElement("p");
      copy.className = "lede";
      copy.textContent = message;
      result.append(title, copy);
    }

    function render(payload, finding) {
      result.replaceChildren();
      const title = document.createElement("h2");
      title.textContent = "引用";
      const clause = document.createElement("p");
      clause.className = "clause-title";
      clause.textContent = payload.clause_id + " · " + payload.anchors.length + " 处";
      result.append(title, clause);
      const complete = payload.anchors.some((anchor) => anchor.text.includes(finding));
      if (!complete) {
        const note = document.createElement("p");
        note.className = "note";
        note.textContent = "这句话跨在下面几处，单处没有写全。";
        result.append(note);
      }
      const groups = new Map();
      payload.anchors.forEach((anchor) => {
        if (!groups.has(anchor.document)) groups.set(anchor.document, []);
        groups.get(anchor.document).push(anchor);
      });
      groups.forEach((anchors, name) => {
        const group = document.createElement("section");
        group.className = "group";
        const header = document.createElement("header");
        const heading = document.createElement("h3");
        heading.textContent = name;
        const count = document.createElement("p");
        count.className = "meta";
        count.textContent = anchors.length + " 处";
        header.append(heading, count);
        group.append(header);
        anchors.forEach((anchor) => {
          const article = document.createElement("article");
          const place = document.createElement("p");
          place.className = "where";
          const kind = document.createElement("span");
          kind.textContent = kinds[anchor.kind] || anchor.kind;
          const position = document.createElement("span");
          position.textContent = where(anchor);
          place.append(kind, position);
          article.append(place, excerpt(anchor.text, finding));
          group.append(article);
        });
        result.append(group);
      });
    }

    async function loadCorpus() {
      try {
        const response = await fetch("/api/corpus");
        if (!response.ok) throw new Error("unavailable");
        const payload = await response.json();
        rootNode.textContent = payload.root;
        fileList.replaceChildren();
        payload.files.forEach((file) => {
          const item = document.createElement("li");
          const name = document.createElement("strong");
          name.textContent = file.document;
          const meta = document.createElement("span");
          meta.className = "meta";
          meta.textContent = file.kind.toUpperCase() + " · " + sizeLabel(file.bytes);
          item.append(name, meta);
          fileList.append(item);
        });
        if (payload.files.length === 0) {
          const item = document.createElement("li");
          item.textContent = "目录里没有 PDF 或 DOCX。";
          fileList.append(item);
        }
      } catch {
        rootNode.textContent = "请通过本地服务打开此页。";
        fileList.replaceChildren();
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const finding = document.querySelector("#finding").value;
      const selected = tools();
      formStatus.className = "status";
      formStatus.textContent = "";
      if (!selected) {
        formStatus.classList.add("is-alert");
        formStatus.textContent = "请至少选择一种文件。";
        return;
      }
      button.disabled = true;
      button.textContent = "检索中";
      try {
        const response = await fetch("/api/cite", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            clause_id: document.querySelector("#clause").value,
            version: document.querySelector("#version").value,
            finding: finding,
            document_tools: selected,
          }),
        });
        const payload = await response.json();
        if (!response.ok) {
          clearResult("没有可引用的位置。请核对条款号、版本是否写在同一文件里，以及语句是否落在该条款内。");
          formStatus.classList.add("is-alert");
          formStatus.textContent = "未找到引用。";
          return;
        }
        render(payload, finding);
        formStatus.textContent = "已列出 " + payload.anchors.length + " 处。";
      } catch {
        clearResult("本地服务没有返回结果。");
        formStatus.classList.add("is-alert");
        formStatus.textContent = "检索没有完成。";
      } finally {
        button.disabled = false;
        button.textContent = "检索";
      }
    });

    const params = new URLSearchParams(location.search);
    const presetClause = params.get("clause");
    const presetVersion = params.get("version");
    const presetFinding = params.get("finding");
    if (presetClause) document.querySelector("#clause").value = presetClause;
    if (presetVersion) document.querySelector("#version").value = presetVersion;
    if (presetFinding) document.querySelector("#finding").value = presetFinding;
    loadCorpus();
    if (params.get("run") === "1" && presetClause && presetVersion && presetFinding) {
      form.requestSubmit();
    }
  </script>
</body>
</html>
