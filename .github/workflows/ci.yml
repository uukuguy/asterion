name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - id: promotion-npm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/asterion-promotion-npm-cache
          key: promotion-npm-${{ runner.os }}-${{ hashFiles('packages/typescript/asterion-runtime/package-lock.json', 'packages/typescript/prime-gateway/package-lock.json', 'packages/typescript/prime-gateway/resources/prime-artifact-lock.json') }}
      - name: Require pre-populated promotion npm cache
        if: steps.promotion-npm-cache.outputs.cache-hit != 'true'
        run: exit 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: make first-run-check
      - run: make promotion-check
        env:
          ASTERION_PROMOTION_NPM_CACHE: ${{ runner.temp }}/asterion-promotion-npm-cache
          ASTERION_PRIME_NODE: ${{ runner.tool_cache }}/node/22.19.0/x64/bin/node
